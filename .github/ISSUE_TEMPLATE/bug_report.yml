name: Bug Report
description: Create a report to help us improve python-jiocloud
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code snippet / Reproduction
      description: |
        Please provide a minimal code snippet to reproduce the issue.
        REMEMBER: Remove any real tokens, phone numbers, or secrets!
    validations:
      required: true
